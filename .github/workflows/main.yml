name: CI Pipeline
on:
  push:
    branches: [ main, development, release ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: echo "Hello World"
    - name: Run tests
      run: npm test
    - name: Run integration tests
      run: npm run integration-test

name: CI Pipeline
on:
  push:
    branches: [ main, development, release/v1.0.0 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: echo "Hello World"
    - name: Run tests
      run: npm test
    - name: Run integration tests
      run: npm run integration-test
    - name: Generate documentation
      run: |
        npm run docs
        cp -r generated-docs/ public/
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: public/
